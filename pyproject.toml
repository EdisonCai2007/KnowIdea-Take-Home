[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-prover"
version = "0.1.0"
description = "Phase 1 skeleton for the Decision Prover take-home."
readme = "codex-resources/original-project-specs/assignment.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
  "typer>=0.21,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
decision-prover = "decision_prover.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"decision_prover.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
